# 每天访问一次 Supabase 数据库，防止免费项目因 7 天无活动被自动暂停
name: Supabase keep-alive

on:
  schedule:
    - cron: "23 17 * * *"   # 每天 UTC 17:23（洛杉矶冬令时上午 9:23，夏令时 10:23）
  workflow_dispatch:         # 允许在 GitHub 页面手动运行

permissions:
  actions: write             # 供 keepalive 步骤防止 GitHub 在 60 天无提交后停用定时任务
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query availability_slots
        env:
          # 与 index.html 中相同的公开 anon key（本来就公开在网页里）
          SUPABASE_URL: https://ehzaucucynwyuhflbxmw.supabase.co
          SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVoemF1Y3VjeW53eXVoZmxieG13Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NTkzMjAsImV4cCI6MjA5NDEzNTMyMH0.mfT96M36KZi230LwcXan6BxN47R6IH6GkBt9-v7NWuk
        run: |
          code=$(curl -s -o body.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/availability_slots?select=date&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $code"; cat body.txt; echo
          if [ "$code" != "200" ]; then
            echo "::error::Supabase 没有正常响应（可能已被暂停），请登录 Supabase 点 Resume project"
            exit 1
          fi

  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable this workflow (resets GitHub's 60-day inactivity timer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
